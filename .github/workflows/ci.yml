name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # Backlog cleared — clippy is now a hard gate. Keep it clean: fix lints
        # or add a justified #[allow] at the narrowest scope.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  rust-postgres:
    name: Rust (Postgres integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Exercises the real Postgres store paths (migrations + type-sensitive SQL)
      # that the in-memory unit tests can't reach. Gated on TEST_DATABASE_URL.
      - name: Postgres integration tests
        env:
          TEST_DATABASE_URL: postgres://t:t@localhost:5432/t
        run: cargo test -p trigix-platform --test postgres_integration

  windows-automation:
    name: Windows automation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Prepare isolated Host sidecar
        shell: pwsh
        run: ./apps/desktop/scripts/prepare-sidecar.ps1 -Configuration debug

      - name: Clippy Windows desktop targets
        run: cargo clippy -p trigix-desktop-shell -p trigix-desktop-automation -p desktop-automation-host -p desktop-automation-fixture --all-targets -- -D warnings

      - name: Check native Tauri shell
        run: cargo check -p trigix-desktop-shell

      - name: Build native fixture
        run: cargo build -p desktop-automation-fixture

      - name: Sign and verify deterministic fixture
        shell: pwsh
        run: |
          ./services/desktop-automation-fixture/qualify-signature.ps1 `
            -Action Sign `
            -FixturePath target/debug/desktop-automation-fixture.exe `
            -StateDirectory "${{ runner.temp }}/trigix-fixture-signing"

      - name: Record qualification environment
        shell: pwsh
        run: |
          Write-Host "OS=$([Environment]::OSVersion.VersionString)"
          Write-Host "Architecture=$([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          Write-Host "Culture=$((Get-Culture).Name)"
          Write-Host "Session=$([Environment]::UserInteractive)"

      - name: Run native adapter qualification
        shell: pwsh
        run: |
          ./services/desktop-automation-fixture/qualify-signature.ps1 `
            -Action Verify `
            -FixturePath target/debug/desktop-automation-fixture.exe `
            -StateDirectory "${{ runner.temp }}/trigix-fixture-signing"
          $env:TRIGIX_WINDOWS_FIXTURE_EXE = (Resolve-Path target/debug/desktop-automation-fixture.exe).Path
          cargo test -p desktop-automation-host --test windows_qualification -- --nocapture --test-threads=1

      - name: Run Windows automation unit and process tests
        shell: pwsh
        run: |
          $hostTriple = rustc -vV | Select-String '^host: ' | ForEach-Object { $_.Line.Substring(6).Trim() }
          $env:TRIGIX_AUTOMATION_HOST_EXE = (Resolve-Path "target/$hostTriple/debug/desktop-automation-host.exe").Path
          cargo test -p trigix-desktop-shell --lib
          cargo test -p trigix-desktop-automation
          cargo test -p desktop-automation-host --test process_boundary

      - name: Prepare ephemeral Windows development identity
        if: matrix.os == 'windows-2022'
        id: windows-development-signing
        shell: pwsh
        run: |
          $config = ./apps/desktop/scripts/qualify-windows-development-signing.ps1 `
            -Action Prepare `
            -StateDirectory "${{ runner.temp }}/trigix-development-signing"
          "config=$config" >> $env:GITHUB_OUTPUT

      - name: Build self-signed NSIS qualification package
        if: matrix.os == 'windows-2022'
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build --debug --bundles nsis --config "${{ steps.windows-development-signing.outputs.config }}"

      - name: Verify self-signed Windows development package
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/debug/bundle/nsis -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw "NSIS installer was not produced." }
          $installDirectory = Join-Path "${{ runner.temp }}" "trigix-development-install"
          if (Test-Path -LiteralPath $installDirectory) {
            throw "Isolated development installation directory already exists."
          }
          try {
            $install = Start-Process `
              -FilePath $installer.FullName `
              -ArgumentList @("/S", "/D=$installDirectory") `
              -PassThru `
              -Wait
            if ($install.ExitCode -ne 0) {
              throw "NSIS development installation failed with exit code $($install.ExitCode)."
            }
            $application = Get-ChildItem -LiteralPath $installDirectory -Recurse -Filter 'trigix-desktop.exe' | Select-Object -First 1
            $automationHost = Get-ChildItem -LiteralPath $installDirectory -Recurse -Filter 'desktop-automation-host.exe' | Select-Object -First 1
            if ($null -eq $application -or $null -eq $automationHost) {
              throw "Installed development application or Host is missing."
            }
            ./apps/desktop/scripts/qualify-windows-development-signing.ps1 `
              -Action Verify `
              -ArtifactPath @($installer.FullName, $application.FullName, $automationHost.FullName) `
              -StateDirectory "${{ runner.temp }}/trigix-development-signing"
          }
          finally {
            if (Test-Path -LiteralPath $installDirectory -PathType Container) {
              $uninstaller = Get-ChildItem -LiteralPath $installDirectory -Recurse -Filter 'uninstall.exe' | Select-Object -First 1
              if ($null -ne $uninstaller) {
                Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
              }
              if (Test-Path -LiteralPath $installDirectory -PathType Container) {
                Remove-Item -LiteralPath $installDirectory -Recurse -Force
              }
            }
          }

      - name: Upload Windows development-signing evidence
        if: matrix.os == 'windows-2022'
        uses: actions/upload-artifact@v7
        with:
          name: windows-development-signed-qualification
          path: |
            target/debug/bundle/nsis/*.exe
            ${{ runner.temp }}/trigix-development-signing/windows-development-signing.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload fixture signature evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fixture-signature-${{ matrix.os }}
          path: ${{ runner.temp }}/trigix-fixture-signing/qualification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Remove fixture signing state
        if: always()
        shell: pwsh
        run: |
          ./services/desktop-automation-fixture/qualify-signature.ps1 `
            -Action Cleanup `
            -FixturePath target/debug/desktop-automation-fixture.exe `
            -StateDirectory "${{ runner.temp }}/trigix-fixture-signing"

      - name: Remove Windows development-signing state
        if: always() && matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          ./apps/desktop/scripts/qualify-windows-development-signing.ps1 `
            -Action Cleanup `
            -StateDirectory "${{ runner.temp }}/trigix-development-signing"

  macos-automation:
    name: macOS automation (${{ matrix.os }}, ${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
          - os: macos-15-intel
            architecture: x86_64
          - os: macos-26
            architecture: arm64
          - os: macos-26-intel
            architecture: x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Configure Swift runtime lookup
        run: |
          swift_runtime_paths="$(swiftc -print-target-info | jq -r '.paths.runtimeLibraryPaths | join(":")')"
          test -n "$swift_runtime_paths"
          printf 'DYLD_LIBRARY_PATH=%s\n' "$swift_runtime_paths" >> "$GITHUB_ENV"

      - name: Rebuild Swift bridges for selected Xcode
        run: cargo clean -p axuielement -p apple-cf

      - name: Prepare native Host sidecar
        run: ./apps/desktop/scripts/prepare-sidecar.sh debug

      - name: Clippy macOS desktop targets
        run: cargo clippy -p trigix-desktop-shell -p trigix-desktop-automation -p desktop-automation-host --all-targets -- -D warnings

      - name: Run macOS automation and process tests
        run: |
          host_triple="$(rustc -vV | awk '/^host: / { print $2 }')"
          export TRIGIX_AUTOMATION_HOST_EXE="$PWD/target/$host_triple/debug/desktop-automation-host"
          cargo test -p trigix-desktop-shell --lib
          cargo test -p trigix-desktop-automation
          cargo test -p desktop-automation-host --test process_boundary

      - name: Prepare ephemeral macOS development identity
        if: matrix.os == 'macos-15' && matrix.architecture == 'arm64'
        id: macos-development-signing
        run: |
          config="$(./apps/desktop/scripts/qualify-macos-development-signing.sh prepare "$RUNNER_TEMP/trigix-development-signing")"
          printf 'config=%s\n' "$config" >> "$GITHUB_OUTPUT"
          printf 'APPLE_SIGNING_IDENTITY=Trigix Development Qualification\n' >> "$GITHUB_ENV"

      - name: Build self-signed Universal DMG qualification package
        if: matrix.os == 'macos-15' && matrix.architecture == 'arm64'
        working-directory: apps/desktop
        run: |
          ./scripts/prepare-universal-sidecar.sh release
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg --config "${{ steps.macos-development-signing.outputs.config }}"
          dmg_path="$(find ../../target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$dmg_path"
          ./scripts/qualify-macos-development-signing.sh verify "$RUNNER_TEMP/trigix-development-signing" "$dmg_path"

      - name: Upload self-signed Universal DMG evidence
        if: matrix.os == 'macos-15' && matrix.architecture == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal-development-signed-qualification
          path: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/trigix-development-signing/macos-development-signing.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove macOS development-signing state
        if: always() && matrix.os == 'macos-15' && matrix.architecture == 'arm64'
        run: ./apps/desktop/scripts/qualify-macos-development-signing.sh cleanup "$RUNNER_TEMP/trigix-development-signing"

  web:
    # Keep this stable: the protected branch requires this check name.
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

      - name: Unit tests with coverage gate
        run: npm run test:coverage

      - name: Upload Web coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: web-coverage
          path: |
            apps/web/coverage/coverage-summary.json
            apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 30

      - name: Node SDK tests
        working-directory: sdk/typescript
        run: node --test

  web-e2e:
    name: Web (e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Drives the built SPA in a real browser with the backend mocked, covering
      # browser-only behaviour (captcha widget, attribution) that Rust/unit tests
      # can't reach. The Playwright config builds + previews the app itself.
      - name: Run e2e
        run: npm run e2e

  ai-runtime:
    name: AI Runtime (tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: t
          POSTGRES_PASSWORD: t
          POSTGRES_DB: t
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U t"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/ai-runtime
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-test.lock

      - name: Test (unit + pgvector integration)
        env:
          RAG_TEST_DATABASE_URL: postgresql://t:t@localhost:5432/t
        run: python -m pytest -q

      - name: Node SDK tests
        working-directory: sdk/python
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -e . --no-deps
          python -m pytest -q

  security:
    name: Security (dependency audit, release inputs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          python -m pip install pip-audit==2.10.1

      - name: Prepare evidence directory
        run: mkdir -p evidence

      - name: Verify deterministic release inputs
        run: python scripts/release/verify_release_inputs.py --output evidence/release-inputs.json

      - name: Audit Rust dependencies
        # RUSTSEC-2023-0071 is the single documented no-fix exception in ADR
        # 0016. All other vulnerability advisories remain hard failures.
        run: cargo audit --ignore RUSTSEC-2023-0071 --json > evidence/cargo-audit.json

      - name: Audit Node dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high --json > ../../evidence/npm-audit.json

      - name: Audit AI Runtime dependencies
        run: pip-audit -r services/ai-runtime/requirements.lock --format json --output evidence/ai-runtime-pip-audit.json

      - name: Audit AI Runtime test dependencies
        run: pip-audit -r services/ai-runtime/requirements-test.lock --format json --output evidence/ai-runtime-test-pip-audit.json

      - name: Audit Python SDK dependencies
        run: pip-audit -r sdk/python/requirements.lock --format json --output evidence/python-sdk-pip-audit.json

      - name: Upload dependency and release-input evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-quality-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

  docker:
    name: Docker (image build smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: trigix-platform:ci
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

      - name: Build AI runtime image
        uses: docker/build-push-action@v7
        with:
          context: ./services/ai-runtime
          load: true
          tags: trigix-ai-runtime:ci
          cache-from: type=gha,scope=ai-runtime
          cache-to: type=gha,mode=max,scope=ai-runtime

      - name: Smoke - platform binary and nginx present
        run: docker run --rm --entrypoint /bin/sh trigix-platform:ci -c 'command -v trigix-platform && nginx -v'

      - name: Smoke - AI runtime answers /healthz
        run: |
          docker run -d --name airt -p 8000:8000 trigix-ai-runtime:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          docker rm -f airt

  helm:
    name: Helm (lint, template)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Lint
        run: helm lint charts/trigix --set secrets.credentialMasterKey=ci-render-key

      - name: Fail closed without a credential master key (security guard)
        run: |
          if helm template t charts/trigix > /dev/null 2>&1; then
            echo "::error::chart rendered without secrets.credentialMasterKey — the fail-closed credential-encryption guard is broken"
            exit 1
          fi
          echo "OK: chart fails closed when no master key is configured"

      - name: Template (default + value permutations)
        run: |
          KEY_ARGS=(--set secrets.credentialMasterKey=ci-render-key)
          helm template t charts/trigix "${KEY_ARGS[@]}" > /tmp/default.yaml
          helm template t charts/trigix "${KEY_ARGS[@]}" --set executor.enabled=true > /tmp/executor.yaml
          helm template t charts/trigix "${KEY_ARGS[@]}" --set aiRuntime.enabled=false > /tmp/no-ai.yaml
          helm template t charts/trigix --set secrets.databaseUrl=postgres://u:p@h:5432/d "${KEY_ARGS[@]}" > /tmp/extdb.yaml
          # Dev escape hatch must also render.
          helm template t charts/trigix --set allowPlaintextCredentials=true > /tmp/plaintext.yaml

      - name: Validate manifests against Kubernetes schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.29.0 \
            /tmp/default.yaml /tmp/executor.yaml /tmp/no-ai.yaml /tmp/extdb.yaml

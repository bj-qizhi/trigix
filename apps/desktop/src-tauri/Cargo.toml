[package]
name = "trigix-desktop-shell"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "trigix_desktop_shell"
path = "src/lib.rs"

[[bin]]
name = "trigix-desktop"
path = "src/main.rs"

[dependencies]
desktop-agent-core = { path = "../../../crates/desktop-agent-core" }
desktop-identity = { path = "../../../crates/desktop-identity" }
desktop-protocol = { path = "../../../crates/desktop-protocol" }
desktop-avatar = { path = "../../../crates/desktop-avatar" }
trigix-desktop-automation = { path = "../../../crates/desktop-automation" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tauri = { version = "2.11.5", default-features = false, features = ["wry"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
tauri-build = "2.6.3"

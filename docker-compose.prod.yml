services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trigix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-trigix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Note: schema is applied by the app at startup via sqlx::migrate!, so the
    # migrations are NOT mounted into docker-entrypoint-initdb.d (that would
    # create the tables without sqlx's tracking table and make the app's
    # migration step fail).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trigix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-runtime:
    build:
      context: ./services/ai-runtime
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      browser-runtime:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-trigix}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-trigix}
      # Optional — real embeddings / reranker / Chinese FTS / agent model gateway.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAG_FTS_CONFIG: ${RAG_FTS_CONFIG:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      # Self-hosted / China-reachable embeddings (DashScope, bge-m3 via vLLM/TEI…).
      EMBED_BASE_URL: ${EMBED_BASE_URL:-}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_MODEL: ${EMBED_MODEL:-}
      EMBED_DIM: ${EMBED_DIM:-}
      BROWSER_RUNTIME_BASE_URL: http://browser-runtime:38100
      BROWSER_RUNTIME_AUTH_TOKEN: ${BROWSER_RUNTIME_AUTH_TOKEN:?set a random BROWSER_RUNTIME_AUTH_TOKEN of at least 32 characters}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  browser-runtime:
    build:
      context: ./services/browser-runtime
    restart: unless-stopped
    init: true
    depends_on:
      redis:
        condition: service_healthy
    shm_size: "1gb"
    environment:
      NODE_ENV: production
      BROWSER_RUNTIME_AUTH_TOKEN: ${BROWSER_RUNTIME_AUTH_TOKEN:?set a random BROWSER_RUNTIME_AUTH_TOKEN of at least 32 characters}
      REDIS_URL: redis://redis:6379
      BROWSER_ARTIFACT_PROVIDER: ${BROWSER_ARTIFACT_PROVIDER:-local}
      BROWSER_ARTIFACT_DIR: /data/browser
      BROWSER_ARTIFACT_BUCKET: ${BROWSER_ARTIFACT_BUCKET:-}
      BROWSER_ARTIFACT_ENDPOINT: ${BROWSER_ARTIFACT_ENDPOINT:-}
      BROWSER_ARTIFACT_REGION: ${BROWSER_ARTIFACT_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${BROWSER_ARTIFACT_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BROWSER_ARTIFACT_SECRET_ACCESS_KEY:-}
      BROWSER_BLOCK_PRIVATE_NETWORK: "true"
      BROWSER_ENABLE_EVALUATE: "false"
    volumes:
      - browser_artifacts:/data/browser
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:38100/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-runtime:
        condition: service_started
      browser-runtime:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:80"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-trigix}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-trigix}
      REDIS_URL: redis://redis:6379
      AI_RUNTIME_BASE_URL: http://ai-runtime:8000
      BROWSER_RUNTIME_BASE_URL: http://browser-runtime:38100
      BROWSER_RUNTIME_AUTH_TOKEN: ${BROWSER_RUNTIME_AUTH_TOKEN:?set a random BROWSER_RUNTIME_AUTH_TOKEN of at least 32 characters}
      DEV_API_KEY: ${API_KEY:-changeme}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AUTH_REQUIRED: "true"
      # Encrypts stored credentials/SSO secrets at rest (AES-256-GCM). Required:
      # the platform refuses to start without it when a database is configured.
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?set a strong CREDENTIAL_MASTER_KEY in your .env}
      RUST_LOG: ${RUST_LOG:-info}
      # Set USE_QUEUE=true to run executions through the Redis Streams queue.
      USE_QUEUE: ${USE_QUEUE:-false}
      EXEC_QUEUE_RECLAIM_IDLE_MS: ${EXEC_QUEUE_RECLAIM_IDLE_MS:-900000}
      EXEC_QUEUE_MAX_RECOVERIES: ${EXEC_QUEUE_MAX_RECOVERIES:-3}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:38080/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  browser_artifacts:
